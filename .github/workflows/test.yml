name: 🧪 Test

on:
  push:

jobs:
  test:
    name: Test DuckDB Setup (${{ matrix.target.platform }} ${{ matrix.target.arch }}, ${{ matrix.version }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: ubuntu-26.04, platform: Linux, arch: AMD64 }
          - { os: ubuntu-26.04-arm, platform: Linux, arch: ARM64 }
          - { os: windows-2025, platform: Windows, arch: AMD64 }
          - { os: windows-11-arm, platform: Windows, arch: ARM64 }
          - { os: macos-15-intel, platform: macOS, arch: AMD64 }
          - { os: macos-15, platform: macOS, arch: ARM64 }
        version:
          - v2.0.0
          - v1.5.2
    steps:
      - name: Setup DuckDB
        uses: opt-nc/setup-duckdb-action@develop
        with:
          version: ${{ matrix.version }}
      - name: Verify DuckDB Installation
        run: duckdb --version
