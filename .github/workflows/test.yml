name: 🧪 Test

on:
  push:

jobs:
  test:
    name: Test DuckDB Setup (${{ matrix.os }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-2025
          - windows-11-arm
          - macos-15-intel
          - macos-15
        version:
          - v2.0.0
          - v1.5.2
    steps:
      - name: Setup DuckDB
        uses: opt-nc/setup-duckdb-action@develop
        with:
          version: ${{ matrix.version }}
      - name: Verify DuckDB Installation
        run: duckdb --version
