name: 🧪 Test

on:
  push:

    
jobs:
  test-ubuntu-amd64-latest:
    name: Test DuckDB Setup
    runs-on: ubuntu-26.04
    steps:
      - name: Setup DuckDB
        uses: opt-nc/setup-duckdb-action@others-arch
        with:
          version: v2.0.0
      - name: Verify DuckDB Installation
        run: duckdb --version

  test-ubuntu-amd64-previous:
    name: Test DuckDB Setup (Previous Version)
    runs-on: ubuntu-26.04
    steps:
      - name: Setup DuckDB
        uses: opt-nc/setup-duckdb-action@others-arch
